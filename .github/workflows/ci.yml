name: CI/CD Pipeline

# Dispara a cada push (qualquer branch), em Pull Requests para a main e manualmente (workflow_dispatch).
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Execuções manuais não substituem um push da main que esteja aguardando deploy.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  testes:
    name: 1. Build e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instala o Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # O mvnw está versionado sem permissão de execução (o Dockerfile faz o mesmo chmod).
      - name: Dá permissão ao Maven Wrapper
        run: chmod +x mvnw

      # Compila o código e roda os testes unitários, de integração (H2) e de aceitação.
      # Se qualquer teste falhar, a esteira fica vermelha aqui e barra os estágios de imagem e deploy.
      - name: Compila e roda os testes
        run: ./mvnw -B test

  imagem:
    name: 2. Imagem Docker (GHCR)
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixa o código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autentica no GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrai metadados e tags da imagem (latest + SHA do commit)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/4ndrewss/rota-vital
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      # Em branches/PRs valida o build multi-stage sem publicar; na main publica no GHCR.
      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 3. Deploy Automatizado (Render)
    needs: imagem
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Aciona Deploy Hook no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_REF: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL não configurado nas configurações do repositório."
            exit 1
          fi
          echo "Disparando deploy automatizado no Render..."
          # Serviço conectado ao GitHub: a URL do hook já contém ?key=.
          HTTP_STATUS=$(curl -s -o /tmp/render_response.txt -w "%{http_code}" -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${DEPLOY_REF}")
          cat /tmp/render_response.txt
          echo ""
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Falha ao acionar Deploy Hook do Render (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Deploy acionado com sucesso no Render (HTTP $HTTP_STATUS)!"

