spring.application.name=rota-vital
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rotavital}
spring.datasource.username=${DB_USER:rotavital}
spring.datasource.password=${DB_PASSWORD:rotavital}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator em uma porta separada, acessível só dentro do container (ou da máquina sem Docker).
# A porta pública da API não expõe a consulta ao banco feita pelo healthcheck.
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always

# Cota por IP de transporte e concorrência global na porta da aplicação.
# Não aceitar IPs encaminhados por cabeçalhos de clientes sem um proxy confiável configurado.
server.forward-headers-strategy=none
rota.limites.requisicoes-por-minuto=60
rota.limites.requisicoes-simultaneas=2
# Orçamento de 1 a 10000 registros; sem exclusão automática e sem bloquear cálculos.
rota.historico.max-registros=10000
