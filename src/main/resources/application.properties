spring.application.name=rota-vital
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rotavital}
spring.datasource.username=${DB_USER:rotavital}
spring.datasource.password=${DB_PASSWORD:rotavital}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator: só o /actuator/health fica exposto. É o que o healthcheck do Compose consulta,
# e ele inclui o teste de conexão com o banco ("db") na resposta.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always

# Limites por instância: cota global, incluindo respostas de erro; healthcheck isento.
rota.limites.requisicoes-por-minuto=60
rota.limites.requisicoes-simultaneas=2
# Orçamento de 1 a 10000 registros; não há exclusão automática de dados.
rota.historico.max-registros=10000
